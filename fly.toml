# fly launch --copy-config --no-deploy && fly deploy
app = "nigrani-demo"
primary_region = "bom"

[build]
  dockerfile = "Dockerfile"

[env]
  NIGRANI_DEMO = "1"
  PORT = "8000"

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

  [[http_service.checks]]
    grace_period = "20s"
    interval = "30s"
    method = "GET"
    path = "/health"
    timeout = "5s"

[[vm]]
  size = "shared-cpu-1x"
  memory = "1gb"
