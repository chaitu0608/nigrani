<!doctype html><html lang="en"><head><meta charset="utf-8"><title>Nigrani · analyst console</title>
<style>
*{box-sizing:border-box}body{font-family:system-ui,Segoe UI,sans-serif;margin:0;background:#0b1020;color:#e6e9f2;font-size:14px}
header{display:flex;gap:16px;align-items:center;padding:10px 18px;background:#111a33;border-bottom:1px solid #263050}
header h1{font-size:17px;margin:0}header .sp{flex:1}input,select,button,textarea{background:#0b1020;color:#e6e9f2;border:1px solid #33406a;border-radius:6px;padding:5px 8px;font:inherit}
button{cursor:pointer;background:#24336a}button:hover{background:#31458c}button.red{background:#7a2633}button.green{background:#1f6b45}
main{display:grid;grid-template-columns:minmax(420px,1fr) 1.35fr;gap:14px;padding:14px;height:calc(100vh - 52px)}
.pane{background:#111a33;border-radius:10px;padding:12px;overflow:auto}.filters{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:8px}
table{border-collapse:collapse;width:100%}td,th{padding:5px 7px;border-bottom:1px solid #222c4c;text-align:left;white-space:nowrap}
tbody tr:hover{background:#17203d;cursor:pointer}tr.sel{background:#203066!important}.pill{padding:1px 7px;border-radius:10px;font-size:12px}
.open{background:#33406a}.assigned{background:#5a4a12}.escalated{background:#7a2633}.closed{background:#1f4b35}.high{color:#ff8080}.medium{color:#ffd27a}
.card{background:#0e1630;border-radius:8px;padding:10px;margin-bottom:10px}.card h3{margin:0 0 8px;font-size:14px;color:#9fb0e6}
.row{display:flex;gap:6px;flex-wrap:wrap;align-items:center}.bar{height:9px;border-radius:3px}.muted{color:#8090bb}pre{white-space:pre-wrap;margin:0;font-size:12.5px}
.stats span{margin-right:12px}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}#toast{position:fixed;bottom:16px;right:16px;background:#24336a;padding:8px 14px;border-radius:8px;display:none}
</style></head><body>
<header><h1>Nigrani · surveillance console</h1><div class="stats muted" id="stats"></div><div class="sp"></div>
<span class="muted" id="who"></span><input id="key" placeholder="X-API-Key" size="16"><button onclick="saveKey()">Use key</button></header>
<main><section class="pane">
<div class="filters"><select id="f_status"><option value="">any status</option><option>open</option><option>assigned</option><option>escalated</option><option>closed</option></select>
<select id="f_pattern"><option value="">any pattern</option><option>pump</option><option>network</option></select>
<select id="f_priority"><option value="">any priority</option><option>high</option><option>medium</option></select>
<input id="f_account" placeholder="account" size="7"><input id="f_min" placeholder="min score" size="7">
<select id="f_sort"><option value="-score">score ↓</option><option value="-date">date ↓</option><option value="date">date ↑</option><option value="-updated_at">recently updated</option></select>
<button onclick="page=1;load()">Filter</button></div>
<table><thead><tr><th>Alert</th><th>Score</th><th>Pattern</th><th>Pri</th><th>Status</th><th>Assignee</th></tr></thead><tbody id="q"></tbody></table>
<div class="row" style="margin-top:8px"><button onclick="if(page>1){page--;load()}">‹ Prev</button><span id="pg" class="muted"></span><button onclick="page++;load()">Next ›</button></div>
<div class="card" style="margin-top:12px"><h3>Cases</h3><div id="cases" class="muted">-</div></div>
</section>
<section class="pane" id="detail"><p class="muted">Select an alert to see why it fired, the account timeline and its trading network.</p></section></main>
<div id="toast"></div>
<script>
let KEY=localStorage.getItem('nigrani_key')||'analyst-dev-key',page=1,cur=null;document.getElementById('key').value=KEY;
const $=id=>document.getElementById(id),esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function toast(m){const t=$('toast');t.textContent=m;t.style.display='block';setTimeout(()=>t.style.display='none',2600)}
async function api(p,o={}){const r=await fetch(p,{...o,headers:{'X-API-Key':KEY,'Content-Type':'application/json',...(o.headers||{})}});
 const j=await r.json().catch(()=>({}));if(!r.ok){const m=j.error?(typeof j.error.message==='string'?j.error.message:JSON.stringify(j.error.message)):r.status;toast('Error: '+m);throw new Error(m)}return j}
function saveKey(){KEY=$('key').value.trim();localStorage.setItem('nigrani_key',KEY);init()}
async function init(){try{const m=await api('/v1/me');$('who').textContent=`${m.user} (${m.role})`}catch(e){$('who').textContent='not signed in';return}load();stats();loadCases();const h=decodeURIComponent(location.hash);if(h.startsWith('#alert='))show(h.slice(7));else if(h.startsWith('#case='))showCase(+h.slice(6))}
async function stats(){const s=await api('/v1/alerts/stats');const a=s.alerts_by_status;$('stats').innerHTML=Object.entries(a).map(([k,v])=>`<span>${k}: <b>${v}</b></span>`).join('')+
 `<span>analyst precision: <b>${s.analyst_precision??'–'}</b></span>`}
async function load(){const p=new URLSearchParams({page,page_size:20,sort:$('f_sort').value});
 for(const [k,id] of [['status','f_status'],['pattern','f_pattern'],['priority','f_priority'],['account','f_account'],['min_score','f_min']]) if($(id).value) p.set(k,$(id).value);
 const r=await api('/v1/alerts?'+p);const pages=Math.max(1,Math.ceil(r.total/r.page_size));if(page>pages&&r.total){page=pages;return load()}
 $('pg').textContent=`page ${r.page}/${pages} · ${r.total} alerts`;
 $('q').innerHTML=r.items.map(a=>`<tr data-id="${a.alert_id}" class="${cur===a.alert_id?'sel':''}" onclick="show('${a.alert_id}')"><td>${a.alert_id}</td><td>${a.score.toFixed(3)}</td><td>${a.pattern}</td>
 <td class="${a.priority}">${a.priority}</td><td><span class="pill ${a.status}">${a.status}</span>${a.case_id?' <span class=muted>#'+a.case_id+'</span>':''}</td><td>${esc(a.assignee||'')}</td></tr>`).join('')}
async function loadCases(){const r=await api('/v1/cases?page_size=10');$('cases').innerHTML=r.items.length?'<table>'+r.items.map(c=>`<tr onclick="showCase(${c.case_id})"><td>#${c.case_id}</td><td>${esc(c.title)}</td><td>${c.status}</td><td>${c.alert_ids.length} alerts</td></tr>`).join('')+'</table>':'No cases yet.'}
function shapBars(rs){const m=Math.max(...rs.map(r=>Math.abs(r.shap)),1e-9);return rs.map(r=>`<div class=row style="justify-content:space-between"><span>${r.feature} = <b>${r.value}</b></span><span class=muted>${r.shap>0?'+':''}${r.shap}</span></div>
 <div class="bar" style="width:${Math.max(2,100*Math.abs(r.shap)/m)}%;background:${r.shap>0?'#ff5a5a':'#4fd18b'}"></div>`).join('')}
function timelineSvg(t,date){const d=t.days;if(!d.length)return'<span class=muted>no history</span>';const W=560,H=130,pad=26,thr=t.threshold;const x=i=>pad+i*(W-2*pad)/Math.max(1,d.length-1),y=s=>H-pad-s*(H-2*pad);
 const vmax=Math.max(...d.map(v=>v.gross_value),1);let s=`<svg width="100%" viewBox="0 0 ${W} ${H}">`;
 d.forEach((v,i)=>{const h=(H-2*pad)*v.gross_value/vmax;s+=`<rect x="${x(i)-4}" y="${H-pad-h}" width="8" height="${h}" fill="#2a3a70"><title>${v.date} value ${v.gross_value.toLocaleString()}</title></rect>`});
 s+=`<line x1="${pad}" x2="${W-pad}" y1="${y(thr)}" y2="${y(thr)}" stroke="#ffd27a" stroke-dasharray="4"/><text x="${W-pad}" y="${y(thr)-3}" fill="#ffd27a" font-size="10" text-anchor="end">threshold</text>`;
 s+=`<polyline fill="none" stroke="#ff7a7a" stroke-width="2" points="${d.map((v,i)=>x(i)+','+y(v.score)).join(' ')}"/>`;
 d.forEach((v,i)=>{s+=`<circle cx="${x(i)}" cy="${y(v.score)}" r="${v.date===date?5:3}" fill="${v.alert_status?'#ff5a5a':'#8fa0d8'}"><title>${v.date} score ${v.score} ${v.top_symbols.map(q=>q.symbol+' '+q.net_qty).join(', ')}</title></circle>`});
 s+=`<text x="${pad}" y="${H-6}" fill="#8090bb" font-size="10">${d[0].date}</text><text x="${W-pad}" y="${H-6}" fill="#8090bb" font-size="10" text-anchor="end">${d[d.length-1].date}</text></svg>`;
 return s+'<div class=muted>red line = daily risk score, bars = traded value, red dots = alerted days (hover for symbols)</div>'}
function networkSvg(n){const W=560,H=360,cx=W/2,cy=H/2,N=n.nodes.length;const pos={};const others=n.nodes.filter(v=>!v.focus);
 n.nodes.filter(v=>v.focus).forEach(v=>pos[v.id]=[cx,cy]);others.forEach((v,i)=>{const a=2*Math.PI*i/Math.max(1,others.length),r=Math.min(150,60+others.length*4);pos[v.id]=[cx+r*Math.cos(a),cy+r*Math.sin(a)]});
 const col={trade:'#ff7a7a',co_trade:'#ffd27a',kyc:'#7ad1ff'};let s=`<svg width="100%" viewBox="0 0 ${W} ${H}">`;
 n.edges.forEach(e=>{const [a,b]=[pos[e.source],pos[e.target]];if(!a||!b)return;s+=`<line x1="${a[0]}" y1="${a[1]}" x2="${b[0]}" y2="${b[1]}" stroke="${col[e.type]}" stroke-width="${e.type==='trade'?2.5:1.5}" ${e.type==='kyc'?'stroke-dasharray="5 3"':''}><title>${e.type} ${e.symbol||e.shared||''} ${e.qty?('qty '+e.qty):''}${e.days?(e.days+' days'):''}</title></line>`});
 n.nodes.forEach(v=>{const [x,y]=pos[v.id];s+=`<circle cx="${x}" cy="${y}" r="${v.focus?13:9}" fill="${v.alert?'#c0394b':'#33406a'}" stroke="${v.focus?'#fff':'#8090bb'}"><title>acct ${v.id} (${v.acct_type}) score ${v.score} entity ${v.entity_id}</title></circle><text x="${x}" y="${y-14}" fill="#c9d2f0" font-size="10" text-anchor="middle">${v.id}</text>`});
 return s+`</svg><div class=muted>${N} accounts · <span style="color:#ff7a7a">— direct trade</span> · <span style="color:#ffd27a">— same-side co-trading (2+ days)</span> · <span style="color:#7ad1ff">- - shared KYC</span> · red node = alerting that day · window ${n.window_days[0]} → ${n.window_days.at(-1)}</div>`}
async function show(id){cur=id;document.querySelectorAll('#q tr').forEach(r=>r.classList.toggle('sel',r.dataset.id===id));
 const a=await api('/v1/alerts/'+encodeURIComponent(id));const [tl,net]=await Promise.all([api(`/v1/accounts/${a.account}/timeline?end=${a.date}&days=30`),api(`/v1/alerts/${encodeURIComponent(id)}/network`)]);
 const closed=a.status==='closed';
 $('detail').innerHTML=`<div class=card><div class=row style="justify-content:space-between"><h3 style="margin:0">Alert ${id} · account ${a.account}</h3><span class="pill ${a.status}">${a.status}</span></div>
 <div class=muted>score <b>${a.score}</b> · threshold ${a.explanation.threshold} · pattern head <b>${a.pattern}</b> · priority <span class=${a.priority}>${a.priority}</span> · model ${a.model_version} ${a.assignee?'· assignee '+esc(a.assignee):''} ${a.case_id?'· case #'+a.case_id:''} ${a.disposition?'· disposition '+a.disposition:''}</div>
 <div class=row style="margin-top:8px">${closed?`<button onclick="act('reopen',{reason:prompt('Reopen reason')||''})">Reopen</button>`:`
 <input id=asg placeholder="assignee" size=10 value="${esc(a.assignee||'')}"><button onclick="act('assign',{assignee:$('asg').value})">Assign</button>
 ${a.status!=='escalated'?`<button class=red onclick="act('escalate',{reason:prompt('Escalation reason (min 5 chars)')||''})">Escalate</button>`:''}
 <select id=disp><option value=true_positive>true positive</option><option value=false_positive>false positive</option><option value=benign_explained>benign / explained</option></select>
 <input id=cnote placeholder="closing note" size=14><button class=green onclick="act('close',{disposition:$('disp').value,note:$('cnote').value})">Close</button>`}
 <button onclick="draft('${id}')">Draft note</button><button onclick="newCase('${id}')">${a.case_id?'Add to new case':'Open case'}</button></div></div>
 <div class=grid2><div class=card><h3>Why it fired (SHAP, log-odds)</h3>${shapBars(a.explanation.top_reasons)}</div>
 <div class=card><h3>Audit trail</h3>${a.events.map(e=>`<div><span class=muted>${e.ts.slice(0,16)}</span> <b>${e.action}</b> ${esc(e.actor)}: ${esc(e.detail)}</div>`).join('')}</div></div>
 <div class=card><h3>Account timeline (30 trading days)</h3>${timelineSvg(tl,a.date)}</div>
 <div class=card><h3>Trading network</h3>${networkSvg(net)}</div><div class=card id=draftbox style="display:none"><h3>Draft case note</h3><pre id=draft></pre></div>`}
async function act(kind,body){if(kind==='escalate'&&(body.reason||'').length<5)return toast('reason too short');await api(`/v1/alerts/${encodeURIComponent(cur)}/${kind}`,{method:'POST',body:JSON.stringify(body)});
 toast(kind+' ✓');await Promise.all([load(),stats()]);show(cur)}
async function draft(id){const d=await api(`/v1/alerts/${encodeURIComponent(id)}/case-note-draft`);$('draftbox').style.display='block';$('draft').textContent=d.draft}
async function newCase(id){const t=prompt('Case title','Possible manipulation: '+id);if(!t)return;const c=await api('/v1/cases',{method:'POST',body:JSON.stringify({title:t,alert_ids:[id]})});toast('case #'+c.case_id+' opened');loadCases();load();show(id)}
async function showCase(cid){const c=await api('/v1/cases/'+cid);cur=null;$('detail').innerHTML=`<div class=card><h3>Case #${c.case_id}: ${esc(c.title)}</h3><div class=muted>status ${c.status} · owner ${esc(c.owner)}</div>
 <div class=row style="margin-top:8px"><select id=cst>${['open','under_review','str_filed','closed_no_action'].map(s=>`<option ${s===c.status?'selected':''}>${s}</option>`).join('')}</select><button onclick="caseStatus(${cid})">Update status</button></div>
 <h3 style="margin-top:12px">Alerts</h3>${c.alert_ids.map(a=>`<div><a href="#" style="color:#9fc0ff" onclick="show('${a}');return false">${a}</a></div>`).join('')||'none'}
 <h3 style="margin-top:12px">Notes</h3>${c.notes.map(n=>`<div class=card><span class=muted>${n.ts.slice(0,16)} ${esc(n.author)}</span><pre>${esc(n.body)}</pre></div>`).join('')}
 <textarea id=nb rows=3 style="width:100%" placeholder="add a note"></textarea><button onclick="addNote(${cid})">Add note</button></div>`}
async function caseStatus(cid){await api('/v1/cases/'+cid,{method:'PATCH',body:JSON.stringify({status:$('cst').value})});toast('updated');loadCases();showCase(cid)}
async function addNote(cid){await api(`/v1/cases/${cid}/notes`,{method:'POST',body:JSON.stringify({body:$('nb').value})});showCase(cid)}
init();
</script></body></html>
