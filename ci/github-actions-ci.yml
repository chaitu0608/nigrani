# Copy to .github/workflows/ci.yml (the push token used for this repo cannot write workflow files).
name: ci
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install -r requirements.txt ruff
      - run: ruff check nigrani tests docs
      - run: python -m nigrani.generate && python -m nigrani.features && python -m nigrani.train
      - run: pytest -q tests --cov=nigrani --cov-report=term --cov-fail-under=85
  web:
    runs-on: ubuntu-latest
    defaults: {run: {working-directory: web}}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: "20", cache: npm, cache-dependency-path: web/package-lock.json}
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm run build
